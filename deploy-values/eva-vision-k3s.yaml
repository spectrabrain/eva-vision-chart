# values.yaml

# 1. Image Config
image:
  repository: 211722900905.dkr.ecr.ap-northeast-2.amazonaws.com/spectrabrain/eva-vision
  pullPolicy: IfNotPresent
  tag: 3.3.0

runtimeClassName: "nvidia" # containerd ="nvidia" , docker runtime = ""

imagePullSecrets:
  enabled: true
  create: false

  account: "211722900905"
  region: "ap-northeast-2"

  password: ""

# 2. Replica
replicaCount: 1

strategy:
  type: Recreate

# 3. Resources (GPU Setting)
resources:
  limits:
    memory: "36Gi"
    cpu: "10"
  requests:
    memory: "36Gi"
    cpu: "10"

gpu:
  count: 1
  cudaVisibleDevices: ""
  mig:
    resourceName: ""
  mps:
    enabled: true
    pipeDirectory: "/tmp/nvidia-mps"
    logDirectory: "/tmp/nvidia-mps-log"

probes:
  startup:
    initialDelaySeconds: 300
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 60   # S3 다운로드 + archive 시간 반영 (300s + 30s x 60)
  liveness:
    initialDelaySeconds: 0
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

# 서비스 설정
service:
  type: ClusterIP
  port: 8000

# ServiceAccount 설정
serviceAccount:
  create: true
  name: ""        # 비워두면 <release>-sa 로 생성
  annotations: {}
  automountServiceAccountToken: false

# Pod 메타데이터
podAnnotations: {}
podLabels: {}

# 스케줄링 관련
nodeSelector: {}
tolerations: []
affinity: {}

# TorchServe / App 설정
appConfig:
  # JVM Args
  jvmXmx: "2g"
  jvmMaxDirectMemory: "2g"
  vmargs: "-Xmx${TORCHSERVE_JVM_XMX} -XX:MaxDirectMemorySize=${TORCHSERVE_JVM_MAX_DIRECT_MEMORY} -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=logs -Dlog4j.configurationFile=eva_ts/log4j2.xml"

  # Network
  inference_address: "http://0.0.0.0:8080"
  management_address: "http://0.0.0.0:8081"
  metrics_address: "http://0.0.0.0:8082"
  grpc_inference_port: 7070
  grpc_management_port: 7071

  # Metrics / Flags
  enable_envvars_config: true
  enable_metrics_api: false
  metrics_format: "prometheus"
  metrics_interval: 600
  install_py_dep_per_model: true
  default_workers_per_model: 1
  dartf:
    # Node-local engines survive Pod replacement; reserve about 1.2Gi per key.
    engineCacheHostPath: "/var/lib/eva-vision/dartf-engines"
  disable_token_authorization: true

  # Models to Load
  load_models: "Owl-v2.mar,ig.mar,OmDet.mar,LLMDet.mar,RT-DETRV2.mar,DARTF-light.mar,Embedding.mar"

  embedding:
    enabledModels: "DINOv2Small,E5EmbeddingSmall,Qwen3VLEmbed2B"
    modelRoot: "/app/model_dir"
    torchCompileModels: ""
    torchCompileBackend: "inductor"
    torchCompileMode: "default"
    torchCompileDynamic: "auto"

  # Models detail setup
  models:
    Owl-v2:
      "1.0":
        defaultVersion: true
        marName: "Owl-v2.mar"
        minWorkers: 1
        maxWorkers: 1
        batchSize: 1
        maxBatchDelay: 150
    OmDet:
      "1.0":
        defaultVersion: true
        marName: "OmDet.mar"
        minWorkers: 1
        maxWorkers: 1
        batchSize: 1
        maxBatchDelay: 150
    RT-DETRV2:
      "1.0":
        defaultVersion: true
        marName: "RT-DETRV2.mar"
        minWorkers: 1
        maxWorkers: 1
        batchSize: 1
        maxBatchDelay: 150
    LLMDet:
      "1.0":
        defaultVersion: true
        marName: "LLMDet.mar"
        minWorkers: 1
        maxWorkers: 1
        batchSize: 1
        maxBatchDelay: 150
    DARTF:
      "1.0":
        defaultVersion: true
        marName: "DARTF.mar"
        minWorkers: 1
        maxWorkers: 2
        batchSize: 1
        maxBatchDelay: 150
        # Warmup in initialize compiles the box head (~90s on RTX 5090)
        startupTimeout: 600
    DARTF-light:
      "1.0":
        defaultVersion: true
        marName: "DARTF-light.mar"
        minWorkers: 1
        maxWorkers: 3
        batchSize: 1
        maxBatchDelay: 150
        startupTimeout: 600
    Embedding:
      "1.0":
        defaultVersion: true
        marName: "Embedding.mar"
        minWorkers: 1
        maxWorkers: 1
        batchSize: 1
        maxBatchDelay: 150
        responseTimeout: 600
        startupTimeout: 1200
